<!DOCTYPE html>

  <body>

      <section class="hero">

        <section aria-labelledby="produk-title">

            <li>Kopi Tubruk Signature - Rp18.000</li>

        <!-- Tambahan Section Jam Buka dan Lokasi -->

          <h2 id="lokasi-title">Lokasi & Jam Operasional</h2>
          <p>📍 Jl. Batik Kencana No. 42, Pekalongan</p>
